{% if site.author_professional_profiles and site.author_professional_profiles.size > 0 %}
    {% for author_professional_profile in site.author_professional_profiles %}
    {% if author_professional_profile.visibility != false %}
    <h6>
        <a href="{{ author_professional_profile.url }}"><i class="professional-profiles">
        </i> {{ author_professional_profile.text }}
        </a>
    </h6>
    {% endif %}
    {% endfor %}
{% endif %}
